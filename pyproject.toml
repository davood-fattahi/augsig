[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "augsig"
version = "0.2.0"
description = "Augmentation of 1D physiological signals (PPG, ECG): noise, warping, and artifact simulation"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [
    { name = "Davood Fattahi", email = "davood.fattahi@emory.edu" },
    { name = "Xiao Hu", email = "xiao.hu@emory.edu" },
]
keywords = [
    "data augmentation",
    "physiological signals",
    "ECG",
    "PPG",
    "electrocardiography",
    "photoplethysmography",
    "time warping",
    "noise injection",
    "signal processing",
    "machine learning",
    "wearable sensors",
    "biomedical signals",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
]

[project.urls]
Homepage = "https://github.com/davood-fattahi/augsig"
Repository = "https://github.com/davood-fattahi/augsig"
Issues = "https://github.com/davood-fattahi/augsig/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["augsig*"]
